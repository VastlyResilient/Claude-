[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twitter-transcribe"
version = "0.1.0"
description = "Transcribe Twitter/X videos (up to one hour long) to text, SRT, VTT and JSON."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Claude Code" }]
keywords = ["twitter", "x", "transcription", "whisper", "speech-to-text", "subtitles"]
dependencies = [
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
twitter-transcribe = "twitter_transcribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
